name: Custom Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (skip publishing)'
        required: false
        default: false
        type: boolean

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

permissions:
  id-token: write  # Required for OIDC
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      release_upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Get version
        id: get_version
        env:
          RELEASE_INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ -n "$RELEASE_INPUT_VERSION" ]]; then
            echo "version=$RELEASE_INPUT_VERSION" >> "$GITHUB_OUTPUT"
          elif [[ "$RELEASE_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog for release
        id: release_notes
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;
          const changelogPath = 'CHANGELOG.md';
          if (!fs.existsSync(changelogPath)) {
            throw new Error('CHANGELOG.md not found; add it before releasing.');
          }
          const changelog = fs.readFileSync(changelogPath, 'utf8');
          const sections = changelog.split(/^## /m);
          const section = sections.find(s => s.startsWith('[' + version + ']'));
          if (!section) {
            throw new Error('Changelog section [' + version + '] not found. Add a section like "## [' + version + '] - YYYY-MM-DD".');
          }
          const content = ('## ' + section).trim().replace("aiworker","aiworker").replace("AiWorker","AiWorker");
          fs.mkdirSync('artifacts', { recursive: true });
          fs.writeFileSync('artifacts/release-notes.md', content + '\n');
          NODE

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          draft: true
          generate_release_notes: false
          body_path: artifacts/release-notes.md
          name: AiWorker v${{ steps.get_version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: create-release
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_REGISTRY: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # - name: Configure npm auth for Bun
      #   if: ${{ github.event.inputs.dry_run != 'true' }}
      #   env:
      #     NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
      #     NPM_REGISTRY: ${{ env.NPM_REGISTRY }}
      #   shell: bash
      #   run: |
      #     set -euo pipefail
      #     test -n "${NPM_CONFIG_TOKEN:-}" || { echo "NPM_CONFIG_TOKEN secret is not configured" >&2; exit 1; }
      #     mkdir -p "$HOME"
      #     cat > "$HOME/.npmrc" <<EOF
      #     registry=${NPM_REGISTRY}
      #     //registry.npmjs.org/:_authToken=${NPM_CONFIG_TOKEN}
      #     always-auth=true
      #     EOF
      #     chmod 600 "$HOME/.npmrc"
      #     echo "npm config ready"

      # - name: Validate npm auth
      #   if: ${{ !github.event.inputs.dry_run }}
      #   shell: bash
      #   env:
      #     NPM_REGISTRY: ${{ env.NPM_REGISTRY }}
      #   run: |
      #     set -euo pipefail
      #     npm whoami --registry "${NPM_REGISTRY}" > /dev/null

      - name: Install dependencies
        run: |
          node -v
          bash -x ./packages/abc.sh
          # bun install --frozen-lockfile
          bun install

      - name: Build packages
        run: |
          bun run build

      # Both packages are packed and published with bun so the
      # `workspace:*` link from @aiworker/web to @aiworker/sdk is
      # rewritten to the released version. npm leaves it in place and the
      # published tarball then fails to install.
      # - name: Publish SDK to npm
      #   if: ${{ github.event.inputs.dry_run != 'true' }}
      #   working-directory: packages/sdk
      #   env:
      #     NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
      #   run: bun publish --registry "${NPM_REGISTRY}" --access public

      - name: Create npm sdk tarball
        working-directory: packages/sdk
        run: bun pm pack

      - name: Create npm web tarball
        working-directory: packages/web
        run: bun pm pack

      - name: Upload npm tarball to release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: |
            packages/web/*.tgz 
            packages/sdk/*.tgz 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # - name: Publish to npm
      #   if: ${{ github.event.inputs.dry_run != 'true' }}
      #   working-directory: packages/web
      #   env:
      #     NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
      #   run: bun publish --registry "${NPM_REGISTRY}" --access public

  build-desktop-electron-macos:
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
            platform: darwin-aarch64
            runner: macos-26
          - target: x86_64-apple-darwin
            arch: x64
            platform: darwin-x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get bundled OpenCode CLI version
        id: opencode_cli_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').dependencies['@opencode-ai/sdk']")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache bundled OpenCode CLI artifact
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: packages/electron/.cache/opencode-cli
          key: opencode-cli-${{ runner.os }}-${{ matrix.arch }}-${{ steps.opencode_cli_version.outputs.version }}
          restore-keys: |
            opencode-cli-${{ runner.os }}-${{ matrix.arch }}-

  build-desktop-electron-windows:
    needs: create-release
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            platform: win32-x64
          - arch: arm64
            target: aarch64-pc-windows-msvc
            platform: win32-arm64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        # Same rename-before-build contract as the Linux Electron job: abc.sh
        # rebrands packages/electron/package.json so electron-builder emits
        # AiWorker-* installers instead of OpenChamber-*. Renaming workspace
        # package names invalidates bun.lock, so install without
        # --frozen-lockfile (same as publish-npm).
        shell: bash
        run: |
          bash -x ./packages/abc.sh
          bun install

      - name: Get bundled OpenCode CLI version
        id: opencode_cli_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').dependencies['@opencode-ai/sdk']")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache bundled OpenCode CLI artifact
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: packages/electron/.cache/opencode-cli
          key: opencode-cli-${{ runner.os }}-${{ matrix.arch }}-${{ steps.opencode_cli_version.outputs.version }}
          restore-keys: |
            opencode-cli-${{ runner.os }}-${{ matrix.arch }}-

      - name: Build web assets
        working-directory: packages/electron
        run: bun run build:web-assets

      - name: Prepare bundled OpenCode CLI
        working-directory: packages/electron
        shell: bash
        run: |
          bun run prepare:opencode-cli
          bun run verify:opencode-cli
          # Windows arm64 builds on an x64 runner; ripgrep needs the target arch.
          AIWORKER_TARGET_ARCH=${{ matrix.arch }} bun run prepare:ripgrep

      - name: Bundle main process
        working-directory: packages/electron
        run: bun run bundle:main

      - name: Rebuild native modules
        working-directory: packages/electron
        shell: bash
        env:
          # Cross-compile for ARM64 target from x64 runner.
          ELECTRON_BUILDER_ARCH: ${{ matrix.arch }}
        # npmRebuild=false in package.json, so electron-builder won't
        # recompile native deps on its own — we must rebuild against the
        # target Electron ABI before packaging.
        run: node ./scripts/rebuild-native.mjs

      - name: Build Windows app
        working-directory: packages/electron
        shell: bash
        run: |
          node ./scripts/package.mjs --win --${{ matrix.arch }} --publish=never
          bun run verify:opencode-cli:packaged

      - name: Upload installer to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: |
            packages/electron/dist/*.exe
            packages/electron/dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload update manifest as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latest-yml-${{ matrix.target }}
          path: packages/electron/dist/latest.yml
          retention-days: 1

  build-desktop-electron-linux:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            host_arch: x86_64
            artifact_arch: x86_64
            manifest: latest-linux.yml
          - runner: ubuntu-24.04-arm
            arch: arm64
            host_arch: aarch64
            artifact_arch: arm64
            manifest: latest-linux-arm64.yml
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Verify native Linux architecture
        env:
          EXPECTED_HOST_ARCH: ${{ matrix.host_arch }}
          AIWORKER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_HOST_ARCH"
          test "$(node -p 'process.arch')" = "$AIWORKER_TARGET_ARCH"

      - name: Install dependencies
        # abc.sh applies the brand rename BEFORE the build so electron-builder
        # emits AiWorker-* artifacts (the names this workflow uploads). It also
        # rewrites the verify scripts, so verify:linux-appimage expects the
        # renamed AppImage and reads AIWORKER_TARGET_ARCH. Renaming workspace
        # package names invalidates bun.lock, so install without
        # --frozen-lockfile (same contract as publish-npm).
        run: |
          bash -x ./packages/abc.sh
          bun install

      - name: Get bundled OpenCode CLI version
        id: opencode_cli_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').dependencies['@opencode-ai/sdk']")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache bundled OpenCode CLI artifact
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: packages/electron/.cache/opencode-cli
          key: opencode-cli-${{ runner.os }}-${{ matrix.arch }}-${{ steps.opencode_cli_version.outputs.version }}
          restore-keys: |
            opencode-cli-${{ runner.os }}-${{ matrix.arch }}-

      - name: Run focused Electron release tests
        working-directory: packages/electron
        run: |
          bun run test:architecture
          bun run test:updater

      - name: Build and package Linux AppImage
        working-directory: packages/electron
        env:
          AIWORKER_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bun run build:web-assets
          bun run prepare:opencode-cli
          bun run verify:opencode-cli
          bun run prepare:ripgrep
          bun run bundle:main
          bun run rebuild:native
          node ./scripts/package.mjs --linux --${{ matrix.arch }} --publish=never
          bun run verify:opencode-cli:packaged
          bun run verify:linux-appimage

      - name: Validate Linux update manifest
        working-directory: packages/electron
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
          MANIFEST: ${{ matrix.manifest }}
        run: |
          set -euo pipefail
          PRODUCT_NAME="$(node -p "require('./package.json').build.productName")"
          APPIMAGE="dist/${PRODUCT_NAME}-${VERSION}-linux-${ARTIFACT_ARCH}.AppImage"
          node ./scripts/verify-update-manifest.mjs "dist/${MANIFEST}" "$APPIMAGE" "$VERSION"

      - name: Verify expected Linux release files exist
        working-directory: packages/electron
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
          MANIFEST: ${{ matrix.manifest }}
        run: |
          set -euo pipefail
          # upload-artifact only fails when NO path matches, so a missing
          # AppImage next to an existing latest-linux.yml once published a
          # release that contained only the manifest. Fail here instead, and
          # keep the build config's productName in sync with the AiWorker
          # asset names this workflow uploads (abc.sh applies the rename).
          PRODUCT_NAME="$(node -p "require('./package.json').build.productName")"
          if [ "$PRODUCT_NAME" != "AiWorker" ]; then
            echo "::error::packages/electron build.productName is '${PRODUCT_NAME}', expected 'AiWorker' (did packages/abc.sh run?)"
            exit 1
          fi
          APPIMAGE="dist/AiWorker-${VERSION}-linux-${ARTIFACT_ARCH}.AppImage"
          for expected in "$APPIMAGE" "dist/${MANIFEST}"; do
            if [ ! -s "$expected" ]; then
              echo "::error::Expected release file is missing or empty: ${expected}"
              ls -lh dist
              exit 1
            fi
          done
          ls -lh "$APPIMAGE" "dist/${MANIFEST}"

      - name: Upload validated Linux release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-${{ matrix.arch }}
          path: |
            packages/electron/dist/AiWorker-${{ needs.create-release.outputs.version }}-linux-${{ matrix.artifact_arch }}.AppImage
            packages/electron/dist/${{ matrix.manifest }}
          if-no-files-found: error
          retention-days: 1

  publish-electron-linux:
    needs: [create-release, build-desktop-electron-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download x64 Linux release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-release-x64
          path: artifacts/x64

      - name: Download arm64 Linux release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-release-arm64
          path: artifacts/arm64

      - name: Revalidate separate Linux manifests
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          node packages/electron/scripts/verify-update-manifest.mjs \
            artifacts/x64/latest-linux.yml \
            "artifacts/x64/AiWorker-${VERSION}-linux-x86_64.AppImage" \
            "$VERSION"
          node packages/electron/scripts/verify-update-manifest.mjs \
            artifacts/arm64/latest-linux-arm64.yml \
            "artifacts/arm64/AiWorker-${VERSION}-linux-arm64.AppImage" \
            "$VERSION"

      - name: Upload Linux AppImages and manifests to release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: |
            artifacts/x64/AiWorker-${{ needs.create-release.outputs.version }}-linux-x86_64.AppImage
            artifacts/x64/latest-linux.yml
            artifacts/arm64/AiWorker-${{ needs.create-release.outputs.version }}-linux-arm64.AppImage
            artifacts/arm64/latest-linux-arm64.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  combine-electron-manifests:
    needs: [create-release, build-desktop-electron-macos, build-desktop-electron-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Download per-arch update manifests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: latest-yml-*
          path: artifacts

      - name: Finalize combined manifests
        env:
          LATEST_YML_DIR: ${{ github.workspace }}/artifacts
          GH_REPO: ${{ github.repository }}
          AIWORKER_VERSION: ${{ needs.create-release.outputs.version }}
        run: node packages/electron/scripts/finalize-latest-yml.mjs

      - name: Upload combined manifests to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: |
            ${{ runner.temp }}/latest-mac.yml
            ${{ runner.temp }}/latest.yml
            ${{ runner.temp }}/latest-arm64.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize-release:
    needs: [create-release, build-desktop-electron-macos, build-desktop-electron-windows, build-desktop-electron-linux, publish-electron-linux, publish-npm, combine-electron-manifests]
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_UPDATE_ROLE_ID: ${{ secrets.DISCORD_UPDATE_ROLE_ID }}
    steps:
      - name: Verify final Linux release asset inventory
        if: ${{ !github.event.inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          node - <<'NODE'
          (async () => {
          const { REPOSITORY: repo, VERSION: version, GITHUB_TOKEN: token } = process.env;
          const expected = [
            `AiWorker-${version}-linux-x86_64.AppImage`,
            'latest-linux.yml',
            `AiWorker-${version}-linux-arm64.AppImage`,
            'latest-linux-arm64.yml',
          ];
          const response = await fetch(`https://api.github.com/repos/${repo}/releases/tags/v${version}`, {
            headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' },
          });
          if (!response.ok) throw new Error(`Failed to inspect release assets: ${response.status} ${await response.text()}`);
          const release = await response.json();
          for (const name of expected) {
            const matches = release.assets.filter((asset) => asset.name === name);
            if (matches.length !== 1) throw new Error(`Expected exactly one ${name} release asset, found ${matches.length}`);
            if (!Number.isSafeInteger(matches[0].size) || matches[0].size <= 0) {
              throw new Error(`Release asset ${name} has invalid size ${matches[0].size}`);
            }
          }
          console.log(`Verified ${expected.length} Linux release assets and both architecture manifests.`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
